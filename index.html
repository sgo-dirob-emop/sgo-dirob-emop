<style>

.btn.sec{background:transparent;color:var(--azul3);border:1.5px solid var(--linha)}.btn.peq{padding:5px 12px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.per{background:var(--cr)}

.tabela th:first-child{border-radius:12px 0 0 0}.tabela th:last-child{border-radius:0 12px 0 0}

.barra.t i{background:#9AA7BD}.duo{display:grid;gap:3px}.duo small{font-size:11px;color:var(--cinza)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tab{all:unset;cursor:pointer;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:500;border:1.5px solid var(--linha);color:var(--txt)}.tab.on{background:var(--azul);border-color:var(--azul);color:#fff}

.passo:before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:var(--claro);color:var(--azul3);font-family:Poppins;font-weight:700;line-height:28px;z-index:1}
.passo:after{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--linha)}.passo:first-child:after{display:none}
.passo.f:before{background:var(--ok);color:#fff;content:"✓"}.passo.f:after,.passo.a:after{background:var(--ok)}.passo.a:before{background:var(--azul);color:#fff}.passo.a{color:var(--txt);font-weight:700}

.conf li{margin:3px 0}.conf .cr{color:var(--cr);font-weight:700}.conf .av{color:var(--av)}.conf .ok{color:var(--ok)}
.over{position:fixed;inset:0;background:rgba(0,20,60,.6);z-index:20;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px}.over .bar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px}.over iframe{flex:1;border:0;border-radius:14px;background:#fff}
.vazio{text-align:center;color:var(--cinza);padding:26px}.hist{font-size:13px;border-left:3px solid var(--linha);padding:2px 0 2px 12px;margin:0 0 8px}.hist small{color:var(--cinza)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--azul2);color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;z-index:9;display:none}

.login[hidden]{display:none}
.login{position:fixed;inset:0;z-index:30;background:var(--fundo);display:flex;align-items:center;justify-content:center;padding:16px}
.login form{background:var(--papel);border:1px solid var(--linha);border-radius:18px;padding:26px 24px;width:100%;max-width:380px;display:grid;gap:12px}
.login h1{margin:0;color:var(--azul);font-size:24px}.login p{margin:0;color:var(--cinza);font-size:13.5px}.login .erro{color:var(--cr);font-size:13px;min-height:1em}
.usuario{font-size:12px;opacity:.9;padding:8px 6px 0;border-top:1px solid rgba(255,255,255,.25)}.usuario b{display:block;font-size:13px}.usuario button{all:unset;cursor:pointer;text-decoration:underline;font-size:12px;margin-top:4px}
@media (prefers-reduced-motion:no-preference){.barra i{transition:width .4s}}

function calc(o){const ad=(o.aditivos||[]).filter(a=>a.situacao==="Assinado"),vi=Number(o.valorInicial)||0,acres=soma(ad,a=>a.acresc),supr=soma(ad,a=>a.supr),valorAtual=vi+acres-supr;

 const pctTempo=fim&&o.dataInicio?Math.min(1,Math.max(0,dias(o.dataInicio,ref)/Math.max(1,dias(o.dataInicio,fim)))):0;
 const ult=(o.medicoes||[]).map(m=>m.fim).filter(Boolean).sort().pop()||null,mediaMed=(o.medicoes||[]).length?medido/o.medicoes.length:0;
 return{vi,acres,supr,valorAtual,limite,pctAcres:vi?acres/vi:0,diasAd,fim,medido,pctFin,pctTempo,ritmo:pctTempo>.05?pctFin/pctTempo:null,saldoContrato:valorAtual-medido,saldoEmpenho:(Number(o.empenho)||0)-medido,diasRest:fim?dias(hoje,fim):null,ult,mediaMed}}
function alertas(o){const c=calc(o),a=[],ativa=["partida","execucao"].includes(o.etapa),ex=o.etapa==="execucao";
 if(ex&&c.diasRest!=null&&!o.dataConclusao){if(c.diasRest<0)a.push(["cr",`Prazo de execução vencido há ${-c.diasRest} dias. Contrato vencido não se prorroga.`]);else if(c.diasRest<=7)a.push(["cr",`Prazo de execução vence em ${c.diasRest} dias.`]);else if(c.diasRest<=30)a.push(["av",`Prazo de execução vence em ${c.diasRest} dias. Se precisar de aditivo, instruir agora.`])}
 if(ativa&&o.garantiaValidade){const g=dias(hojeISO(),o.garantiaValidade);if(g<0)a.push(["cr","Garantia contratual vencida."]);else if(g<=30)a.push(["av",`Garantia contratual vence em ${g} dias.`])}
 if(ex&&c.saldoEmpenho<0)a.push(["cr",`Medido acima do empenhado em ${brl(-c.saldoEmpenho)}.`]);else if(ex&&c.mediaMed&&c.saldoEmpenho<c.mediaMed)a.push(["av",`Saldo de empenho (${brl(c.saldoEmpenho)}) não cobre a próxima medição média. Pedir reforço.`]);
 if(c.pctAcres>c.limite)a.push(["cr",`Acréscimos de ${pct(c.pctAcres)} acima do limite legal de ${pct(c.limite)}.`]);else if(c.pctAcres>c.limite*.8)a.push(["av",`Acréscimos em ${pct(c.pctAcres)}; limite legal é ${pct(c.limite)}.`]);
 if(ex&&o.status!=="Paralisada"&&!o.dataConclusao){const b=c.ult||o.dataInicio;if(b&&dias(b,hojeISO())>45)a.push(["av",`Sem medição há ${dias(b,hojeISO())} dias.`])}

 (o.prazos||[]).filter(p=>!p.feito).forEach(p=>{const d=dias(hojeISO(),p.data);if(d<0)a.push(["cr",`Prazo vencido: ${p.texto}`]);else if(d<=7)a.push([d<=3?"cr":"av",`${p.texto}: vence em ${d} dias.`])});
 return a}

let canalDB=null;const ouvintes=new Set();
function ouvirDB(){if(canalDB)return;canalDB=sb.channel("documentos").on("postgres_changes",{event:"*",schema:"public",table:"documentos"},pl=>{const c=(pl.new&&pl.new.caminho)||(pl.old&&pl.old.caminho)||"";ouvintes.forEach(f=>f(c))}).subscribe()}
function bancoSupabase(){return{
 doc(p){return{
  async get(){const{data,error}=await sb.from("documentos").select("dados").eq("caminho",p).maybeSingle();if(error)throw erroDB(error);return snapDoc(p,data)},
  async set(d){const{error}=await sb.from("documentos").upsert({caminho:p,colecao:colecaoDe(p),dados:d});if(error)throw erroDB(error)},
  async delete(){const{error}=await sb.from("documentos").delete().eq("caminho",p);if(error)throw erroDB(error)},
  onSnapshot(ok,er){const ler=()=>this.get().then(ok,er||(()=>{}));ler();ouvirDB();const f=c=>{if(c===p)ler()};ouvintes.add(f);return()=>ouvintes.delete(f)}}},
 collection(c){return{
  async get(){let docs=[],de=0;for(;;){const{data,error}=await sb.from("documentos").select("caminho,dados").eq("colecao",c).order("caminho").range(de,de+999);if(error)throw erroDB(error);docs=docs.concat(data.map(r=>snapDoc(r.caminho,r)));if(data.length<1000)break;de+=1000}return{docs}},
  onSnapshot(ok,er){let t=null;const ler=()=>this.get().then(ok,er||(()=>{}));ler();ouvirDB();const f=cam=>{if(colecaoDe(cam)===c){clearTimeout(t);t=setTimeout(ler,250)}};ouvintes.add(f);return()=>ouvintes.delete(f)}}}}}

 S.podeEscrever=S.papel!=="leitura";const u=$("#usuario");u.hidden=false;
 u.innerHTML=`<b>${esc(S.usuario.nome)}</b>${esc({admin:"Administrador",editor:"Pode lançar e alterar",leitura:"Somente consulta"}[S.papel]||S.papel)}<br><button id="bSair">Sair</button>`}

 if(!session){$("#login").hidden=false;$("#lEmail").focus();session=await new Promise(ok=>{
  $("#fLogin").onsubmit=async ev=>{ev.preventDefault();$("#lErro").textContent="Entrando…";const{data,error}=await sb.auth.signInWithPassword({email:$("#lEmail").value.trim(),password:$("#lSenha").value});
   if(error){$("#lErro").textContent=/invalid/i.test(error.message)?"E-mail ou senha incorretos.":"Não foi possível entrar: "+error.message;return}ok(data.session)};
  $("#lEsqueci").onclick=async()=>{const em=$("#lEmail").value.trim();if(!em){$("#lErro").textContent="Digite o e-mail primeiro.";return}
   const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});$("#lErro").textContent=error?"Não foi possível enviar: "+error.message:"Enviamos um link para redefinir a senha."}})}
 $("#login").hidden=true;await carregarPerfil(session.user);
 sb.auth.onAuthStateChange(async(ev,s)=>{if(ev==="SIGNED_OUT")location.reload();if(ev==="PASSWORD_RECOVERY"){const n=prompt("Digite a nova senha (mínimo 8 caracteres):");if(n&&n.length>=8){const{error}=await sb.auth.updateUser({password:n});toast(error?"Não foi possível trocar a senha.":"Senha alterada.")}}});
 return bancoSupabase()}

const atual=()=>S.obras.find(x=>x.id===S.obra);
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-ir],[data-abrir],[data-aba],[data-acao],[data-doc],[data-delmed],[data-abrirmed],[data-boletim],[data-delfoto],[data-reabrir]");if(!t)return;const o=atual();
 if(t.dataset.ir){S.tela=t.dataset.ir;S.doc=null;S.x={};return render()}
 if(t.dataset.abrir){S.doc=null;S.x={};S.obra=t.dataset.abrir;S.tela="obra";S.aba="fluxo";window.scrollTo(0,0);return render()}
 if(t.dataset.aba){S.aba=t.dataset.aba;return render()}
 if(t.dataset.doc){if(S.tela!=="obra"){S.doc=t.dataset.doc;return render()}return abrirDoc(t.dataset.doc,t.dataset.ctx!==undefined?Number(t.dataset.ctx):undefined)}
 if(t.dataset.reabrir!==undefined&&o){const e=o.emitidos[Number(t.dataset.reabrir)];S.doc=e.id;S.ctx=e.ctx;S.x={...(e.x||{})};S.aba="docs";return render()}
 if(t.dataset.boletim&&o)return verBoletim(o,Number(t.dataset.boletim));
 if(t.dataset.abrirmed&&o){const n=Number(t.dataset.abrirmed),m=det(o.id).meds[n],r=o.medicoes.find(x=>x.n===n);S.med={...structuredClone(m),n,ro:r&&r.sit!=="Em elaboração"};S.aba="medir";window.scrollTo(0,0);return render()}
 if(t.dataset.delfoto&&o){const d=det(o.id);d.fotos=d.fotos.filter(f=>f.id!==t.dataset.delfoto);if(S.db)S.db.doc("obras/"+o.id+"/fotos/"+t.dataset.delfoto).delete().catch(()=>{});detLocal(o.id);return render()}
 if(t.dataset.delmed!==undefined&&o){if(!confirmar(t,"Excluir medição?"))return;const m=o.medicoes.splice(Number(t.dataset.delmed),1)[0];{const d=det(o.id);if(d.meds[m.n]){delete d.meds[m.n];if(S.db)S.db.doc("obras/"+o.id+"/medicoes/"+m.n).delete().catch(()=>{});d.fotos.filter(f=>f.med===m.n).forEach(f=>{if(S.db)S.db.doc("obras/"+o.id+"/fotos/"+f.id).delete().catch(()=>{})});d.fotos=d.fotos.filter(f=>f.med!==m.n);detLocal(o.id)}}o.medicoes.forEach((x,i)=>x.n=i+1);registrar(o,`Medição excluída (${brl(m.valor)}).`);salvarObra(o);return render()}
 const a=t.dataset.acao;
 if(a==="nova"){const n={id:"o"+Date.now().toString(36),nome:"",etapa:"contrato",status:"Normal",medicoes:[],aditivos:[],prazos:[],chk:{},historico:[]};registrar(n,"Obra cadastrada.");S.obras.push(n);S.obra=n.id;S.tela="obra";S.aba="dados";salvarObra(n);return render()}
 if(!o)return;
 if(a==="importarpl"){const d=det(o.id),ls=$("#plTxt").value.split(/\r?\n/).map(l=>l.split("\t").map(x=>x.trim())).filter(l=>l.length>=6&&num(l[4])>0),it=ls.map(l=>({item:l[0],cod:l[1],desc:l[2],un:l[3],qtd:num(l[4]),pu:num(l[5])}));
  if(!it.length)return toast("Não reconheci nenhuma linha. São 6 colunas separadas por tabulação, como sai do Excel.");d.pl=(d.pl||[]).concat(it);if(JSON.stringify(d.pl).length>240000){d.pl=d.pl.slice(0,d.pl.length-it.length);return toast("Planilha grande demais para esta versão (limite perto de 1.200 itens).")}
  gravar("planilhas/"+o.id,{itens:d.pl});detLocal(o.id);registrar(o,`Planilha contratual: ${it.length} itens importados.`);salvarObra(o);toast(it.length+" itens importados.");return render()}
 if(a==="limparpl"){if(!confirmar(t,"Clique de novo para apagar"))return;det(o.id).pl=null;if(S.db)S.db.doc("planilhas/"+o.id).delete().catch(()=>{});detLocal(o.id);return render()}
 if(a==="novamed"){const ult=(o.medicoes||[]).map(m=>m.fim).filter(Boolean).sort().pop(),ini=ult?mais(ult,1):(o.dataInicio||"");S.med={n:(o.medicoes||[]).length+1,ini,fim:ini?mais(ini,29):"",qtds:{},memoria:{},tempo:{},obs:"",pst:false,ro:false};S.aba="medir";window.scrollTo(0,0);return render()}
 if(a==="salvarmed"){salvarMed(o,false);return toast("Rascunho salvo.")}
 if(a==="concluirmed"){const er=confere(o,calc(o),det(o.id)).filter(x=>x[0]==="cr");if(er.length)return toast("Corrija: "+er[0][1]);salvarMed(o,true);S.aba="med";toast("Medição enviada para atesto do Gerente.");return render()}
 if(a==="admlocal"){const d=det(o.id),M=S.med,al=d.pl.map((x,i)=>i).filter(i=>/administra[cç][aã]o\s+local/i.test(d.pl[i].desc));if(!al.length)return toast("Nenhum item com 'Administração Local' na descrição.");
  let tot=0,ac=0;d.pl.forEach((x,i)=>{if(al.includes(i))return;tot+=x.qtd*x.pu;ac+=(anterior(d,M.n,i)+(Number(M.qtds[i])||0))*x.pu});const p=tot?Math.min(1,ac/tot):0;
  al.forEach(i=>{const q=Math.max(0,Math.round((d.pl[i].qtd*p-anterior(d,M.n,i))*1000)/1000);M.qtds[i]=q;M.memoria[i]=`Proporcional à execução financeira dos demais itens: ${pct(p)} acumulado`});toast("Administração Local ajustada para "+pct(p)+" acumulado.");return render()}
 if(a==="avancar"){if(pendencias(o).length)return;const i=ETAPAS.findIndex(e=>e.id===o.etapa);registrar(o,`Etapa "${ETAPAS[i].nome}" concluída.`);o.etapa=ETAPAS[i+1].id;salvarObra(o);toast("Etapa concluída.");return render()}
 if(a==="voltar"){if(!confirmar(t,"Confirmar retorno?"))return;const i=ETAPAS.findIndex(e=>e.id===o.etapa);o.etapa=ETAPAS[i-1].id;registrar(o,`Retorno à etapa "${ETAPAS[i-1].nome}".`);salvarObra(o);return render()}
 if(a==="excluir"){if(!confirmar(t,"Clique de novo para excluir"))return;excluirObra(o.id);S.tela="obras";return render()}
 if(a==="addmed"){const v=Number($("#mVal").value),ini=$("#mIni").value,fim=$("#mFim").value,c=calc(o);if(!v||!ini||!fim)return toast("Informe período e valor.");if(fim<ini)return toast("O fim do período é anterior ao início.");if(v>c.saldoContrato+.005)return toast("Valor acima do saldo contratual de "+brl(c.saldoContrato)+".");
  o.medicoes=o.medicoes||[];o.medicoes.push({n:o.medicoes.length+1,ini,fim,valor:v,sit:"Em elaboração"});registrar(o,`Medição nº ${o.medicoes.length} lançada: ${brl(v)}.`);salvarObra(o);return render()}
 if(a==="addadt"){const x={n:(o.aditivos||[]).length+1,tipo:$("#aTipo").value,dias:Number($("#aDias").value)||0,acresc:Number($("#aAc").value)||0,supr:Number($("#aSu").value)||0,motivo:$("#aMot").value.trim(),situacao:"Em instrução"};if(!x.dias&&!x.acresc&&!x.supr)return toast("Informe dias ou valores.");if(!x.motivo)return toast("Descreva o motivo.");
  const c=calc(o);if(c.vi&&(c.acres+x.acresc)/c.vi>c.limite)toast("Atenção: com este aditivo os acréscimos passam do limite legal.");(o.aditivos=o.aditivos||[]).push(x);registrar(o,`${x.n}º aditivo aberto (${x.tipo}).`);salvarObra(o);return render()}
 if(a==="paralisar"){o.status="Paralisada";registrar(o,"Paralisação registrada.");salvarObra(o);return render()}
 if(a==="reinicio"){o.status="Normal";registrar(o,"Reinício registrado.");salvarObra(o);return render()}
 if(a==="addprazo"){const tx=$("#pTxt").value.trim(),d=$("#pData").value;if(!tx||!d)return toast("Informe descrição e vencimento.");(o.prazos=o.prazos||[]).push({texto:tx,data:d,feito:false});registrar(o,"Prazo externo registrado: "+tx);salvarObra(o);return render()}
 if(a==="fechardoc"){S.doc=null;S.x={};return render()}
 if(a==="verdoc"){const D=DOC(S.doc),vazio=(D.x||[]).filter(e=>!e[1].includes("se for o caso")&&!String((S.x||{})[e[0]]??"").trim());if(vazio.length)return toast("Preencha: "+vazio[0][1]);
  const ov=overlay(docHTML(o,S.doc,S.ctx),`${D.id}_Contrato_${String(o.contrato||"").replace(/\W+/g,"-")}.html`,'<button class="btn" id="bReg">Registrar como emitido</button>');
  ov.querySelector("#bReg").onclick=()=>{const ls=D.ctx==="med"?o.medicoes:D.ctx==="adt"?o.aditivos:null,i=ls?(S.ctx??ls.length-1):undefined;if(D.fx)D.fx(o,S.x||{},i);(o.emitidos=o.emitidos||[]).push({id:D.id,nome:(S.modelos[D.id]||D).nome,data:hojeISO(),x:{...(S.x||{})},ctx:i,ref:ls?"nº "+ls[i].n:"",sei:""});registrar(o,"Documento emitido: "+D.nome+(ls?" (nº "+ls[i].n+")":"")+".");salvarObra(o);ov.remove();S.doc=null;S.x={};toast("Registrado. Os dados do documento já atualizaram a obra.");render()};return}
});
document.addEventListener("click",ev=>{const a=ev.target.closest("[data-acao]");if(!a)return;if(a.dataset.acao==="relmensal")return void overlay(relatorioMensal(),"Relatorio_Mensal_DIROB.html");if(a.dataset.acao==="salvarmod"){const id=$("#selDoc").value;S.modelos[id]={nome:$("#modNome").value.trim()||id,texto:$("#modTxt").value};salvarModelos();toast("Modelo salvo.")}
 if(a.dataset.acao==="restaurarmod"){const id=$("#selDoc").value;if(MODELOS_PADRAO[id]){S.modelos[id]=structuredClone(MODELOS_PADRAO[id]);salvarModelos();render()}}});
function confirmar(b,msg){if(b.dataset.ok){return true}b.dataset.ok="1";b.dataset.orig=b.textContent;b.textContent=msg;setTimeout(()=>{if(b.isConnected){b.textContent=b.dataset.orig;delete b.dataset.ok}},3000);return false}
document.addEventListener("change",async ev=>{const t=ev.target,o=atual();if(t.id==="selDoc"){S.doc=t.value;S.ctx=undefined;return render()}if(!o)return;
 if(t.id==="selCtx"){S.ctx=Number(t.value);return render()}
 if(t.dataset.seidoc!==undefined){o.emitidos[Number(t.dataset.seidoc)].sei=t.value.trim();salvarObra(o);return toast("Número do SEI registrado.")}
 if(t.dataset.x){(S.x=S.x||{})[t.dataset.x]=t.value;if(t.type==='date'||t.tagName==='SELECT')render();return}
 if(t.id==="inFotos"){const d=det(o.id),fs=[...t.files].slice(0,12);if(!fs.length)return;toast("Preparando "+fs.length+" foto(s)…");for(const f of fs){try{const img=await comprimir(f),ft={id:"f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),med:S.med.n,legenda:"",data:hojeISO(),item:"",img};d.fotos.push(ft);const{id,...r}=ft;await gravar("obras/"+o.id+"/fotos/"+id,r)}catch(e){toast("Uma das fotos não pôde ser lida.")}}detLocal(o.id);return render()}
 if(t.dataset.fl!==undefined||t.dataset.fd!==undefined||t.dataset.fi!==undefined){const id=t.dataset.fl||t.dataset.fd||t.dataset.fi,f=det(o.id).fotos.find(x=>x.id===id);if(!f)return;if(t.dataset.fl!==undefined)f.legenda=t.value;if(t.dataset.fd!==undefined)f.data=t.value;if(t.dataset.fi!==undefined)f.item=t.value;const{id:_,...r}=f;gravar("obras/"+o.id+"/fotos/"+id,r);detLocal(o.id);return}
 if(t.dataset.plq!==undefined){const d=det(o.id),i=Number(t.dataset.plq),v=num(t.value);if(v<=0)return toast("Quantidade inválida.");const jm=Object.keys(d.meds).reduce((s,k)=>s+(Number((d.meds[k].qtds||{})[i])||0),0);if(v<jm-1e-6)return toast("Já foram medidos "+fq(jm)+" neste item.");d.pl[i].qtd=v;gravar("planilhas/"+o.id,{itens:d.pl});detLocal(o.id);registrar(o,`Planilha: quantidade do item ${d.pl[i].item} ajustada para ${fq(v)}.`);salvarObra(o);return render()}
 if(t.id==="soSaldo"){document.querySelectorAll("#tbMed tr[data-saldo]").forEach(r=>r.style.display=t.checked&&r.dataset.saldo==="0"?"none":"");return}
 if(S.med&&(t.dataset.m||t.dataset.t||t.dataset.q!==undefined||t.dataset.mem!==undefined)){return}
 if(t.dataset.campo){const k=t.dataset.campo;o[k]=CAMPOS[k][1]==="num"?(t.value===""?"":Number(t.value)):t.value.trim();if(k==="dataInicio"&&o[k])registrar(o,"Data de início definida: "+dt(o[k]));salvarObra(o);return render()}
 if(t.dataset.chk){(o.chk=o.chk||{})[t.dataset.chk]=t.checked;salvarObra(o);return render()}
 if(t.dataset.med!==undefined){const m=o.medicoes[Number(t.dataset.med)];m.sit=t.value;if(t.value==="Enviada à DAF"&&!m.envio)m.envio=hojeISO();registrar(o,`Medição nº ${m.n}: ${t.value}.`);salvarObra(o);return render()}
 if(t.dataset.adt!==undefined){const x=o.aditivos[Number(t.dataset.adt)];x.situacao=t.value;registrar(o,`${x.n}º aditivo: ${t.value}.`);salvarObra(o);return render()}
 if(t.dataset.prazo!==undefined){o.prazos[Number(t.dataset.prazo)].feito=t.checked;salvarObra(o);return render()}});
document.addEventListener("input",ev=>{const t=ev.target,M=S.med;if(t.dataset.x&&t.tagName!=="SELECT"){(S.x=S.x||{})[t.dataset.x]=t.value;return}
 if(M&&!M.ro){if(t.dataset.q!==undefined){const i=Number(t.dataset.q);M.qtds[i]=num(t.value);if(!M.qtds[i])delete M.qtds[i];linha(i);return recalc()}if(t.dataset.mem!==undefined){M.memoria[Number(t.dataset.mem)]=t.value;return}if(t.dataset.t){(M.tempo=M.tempo||{})[t.dataset.t]=t.value===""?"":Number(t.value);return recalc()}if(t.dataset.m){M[t.dataset.m]=t.type==="checkbox"?t.checked:t.value;return recalc()}}
 if(t.id==="fItens"){const f=t.value.toLowerCase();document.querySelectorAll("#tbMed tr[data-busca]").forEach(r=>r.style.display=!f||r.dataset.busca.includes(f)?"":"none");return}
 if(ev.target.id==="filtro"){S.filtro=ev.target.value;const p=ev.target.selectionStart;render();const f=$("#filtro");f.focus();f.setSelectionRange(p,p)}});
iniciar();
</script>
</body>
